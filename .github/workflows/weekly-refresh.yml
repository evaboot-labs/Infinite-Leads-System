# Adds the companies that started matching each account signal to its Sales Navigator account list,
# so the recurring Evaboot exports filtered on those lists pick up their people on the next run.
name: Weekly account list refresh

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh account lists
        env:
          EVABOOT_API_KEY: ${{ secrets.EVABOOT_API_KEY }}
        run: python3 infinite_leads.py refresh
